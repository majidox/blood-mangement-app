<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Bank - Donor Management</title>
    <link rel="stylesheet" href="../css/donor.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="dashboard-body">

    <div class="dashboard-container">
        <aside class="sidebar-glass">
            <div class="sidebar-header">
                <i class='bx bxs-droplet-half'></i>
                <span>BLOOD BANK</span>
            </div>
            <div class="user-widget">
                <div class="avatar-wrapper">
                    <img src="" alt="Utilisateur" id="user-avatar">
                </div>
                <div class="user-meta">
                    <h4>Admin User</h4>
                    <p>Lab Technician</p>
                </div>
            </div>
            <nav class="side-nav">
                <a href="dashboard.html" class="nav-item"><i class='bx bxs-dashboard'></i> Dashboard</a>
                <a href="donor.html" class="nav-item active"><i class='bx bxs-user-plus'></i> Donors</a>
                <a href="#" class="nav-item"><i class='bx bxs-layer'></i> Inventory</a>
                <a href="#" class="nav-item"><i class='bx bxs-report'></i> Reports</a>
                <div class="nav-spacer"></div>
                <a id="logout-btn" class="nav-item logout"><i class='bx bxs-log-out'></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-nav">
                <div class="breadcrumb">Donors / Management</div>
            </header>

            <section class="data-panel" style="margin-bottom: 30px;">
                <h3><i class='bx bxs-edit-alt'></i> Register New Donor</h3>
                <form id="donor-form" class="donor-form-grid">
                    <div class="input-group">
                        <label>Last Name (Nom)</label>
                        <input type="text" id="lastName" placeholder="Enter last name" required>
                    </div>
                    <div class="input-group">
                        <label>First Name (Prénom)</label>
                        <input type="text" id="firstName" placeholder="Enter first name" required>
                    </div>
                    <div class="input-group">
                        <label>Birth Date</label>
                        <input type="date" id="birthDate" required>
                    </div>
                    <div class="input-group">
                        <label>Blood Type</label>
                        <select id="bloodType" class="stylish-select" required>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Type Poche</label>
                        <select id="pocheType" class="stylish-select" required>
                            <option value="Simple">Simple</option>
                            <option value="Double">Double</option>
                            <option value="Triple">Triple</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Donation Date (Auto)</label>
                        <input type="text" id="auto-date" readonly class="readonly-input">
                    </div>
                     <!--<button type="submit" class="btn-save">
                        <i class='bx bx-plus-circle'></i> Add Donor
                    </button> -->


                    <div class="form-actions">
                     <button type="submit" id="add-btn" class="btn-save" ><i class='bx bx-plus-circle'></i> Add Donor </button>
    
                    <button type="button" id="edit-btn" style="display: none; " class="btn-save"> <i class='bx bx-save'> </i> Save Edit</button>
                    <button type="button" id="cancel-btn" style="display: none; " class="btn-save"><i class="bx bx-x"></i> Cancel</button>
                      </div>

                    <div id="status-msg" style="display:none; margin-top: 10px; padding: 10px; border-radius: 5px; text-align: center;"></div>


                </form>
            </section>

            <section class="data-panel">
                <h3><i class='bx bx-table'></i> Donor Database List</h3>
                <div class="table-responsive">
                    <table class="donor-table" id="donorTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Prename</th>
                                <th>Blood Type</th>
                                <th>Poche</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="donor-list-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
  <!-- delte confim html -->
    <div id="delete-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:white; padding:20px; border-radius:8px; text-align:center; width:300px;">
        <h3>Are you sure?</h3>
        <p id="modal-text"></p>
        <div style="margin-top:20px;">
            <button id="confirm-yes" style="background:#e53935; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Delete</button>
            <button id="confirm-no" style="background:#999; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; margin-left:10px;">Cancel</button>
        </div>
    </div>
</div>
       <!-- toast notification --> 
    <div id="toast" class="toast-hidden">
    <div class="toast-content">
        <i class='bx bx-check-circle'></i>
        <span id="toast-text">Success Message!</span>
    </div>
     </div>

    <script src="../renderers/donor-renderer.js"></script>
</body>
</html>
